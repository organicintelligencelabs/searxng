# see https://docs.searxng.org/admin/settings/settings.html#settings-use-default-settings
use_default_settings: true
general:
  # Was `true` (inherited from the upstream template). Debug raises the log level
  # and surfaces tracebacks, which is not what you want on a publicly reachable
  # instance. Nothing depends on it.
  debug: false
  # Surfaced at /config as `instance_name`, so it doubles as a cheap way to
  # confirm a deploy actually reached the running container.
  instance_name: "Claos Search"
search:
  formats:
    - html
    - json
    - csv
server:
  # base_url is defined in the SEARXNG_BASE_URL environment variable
  secret_key: "my-custom-secret-key-from-env"
  limiter: false 
  image_proxy: true
ui:
  static_use_hash: true
# Redis configuration
# redis:
#   url: ${REDIS_URL}
